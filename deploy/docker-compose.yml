# Public server. Run every command from this directory so it reads deploy/.env.
# The laptop keeps using the docker-compose.yml in the project root.
name: noname_prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file: .env
  init: true
  volumes:
    - media:/app/media
    - staticfiles:/app/staticfiles
  logging: *logging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DJANGO_DB_NAME:-noname}
      POSTGRES_USER: ${DJANGO_DB_USER:-noname}
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:?Set DJANGO_DB_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}
    volumes:
      - redis_data:/data
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    <<: *app
    restart: unless-stopped
    command: ["web"]
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/deploy/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  bot:
    <<: *app
    restart: unless-stopped
    command: ["python", "manage.py", "telegram_bot"]
    stop_grace_period: 45s
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - staticfiles:/srv/static:ro
      - media:/srv/media:ro
    logging: *logging
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
    name: noname_prod_postgres
  redis_data:
    name: noname_prod_redis
  media:
    name: noname_prod_media
  staticfiles:
    name: noname_prod_static
  caddy_data:
    name: noname_prod_caddy
  caddy_config:
    name: noname_prod_caddy_config
